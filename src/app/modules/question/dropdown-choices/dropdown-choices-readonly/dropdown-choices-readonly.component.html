<div class="question-group">
  <div class="form-group">
    @if (isSaved) {
      <app-editor-readonly-renderer [blocks]="blocks"></app-editor-readonly-renderer>
    }
    @if (isReadOnly) {
      <h1>Readonly {{ blocks | json }}</h1>
      <app-editor-result-renderer [questionId]="question._id!" [blocks]="blocks"></app-editor-result-renderer>
    }
  </div>
</div>
